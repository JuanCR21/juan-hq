:root{--accent:#fa4e50;--ink:#1d0809;--r:16px;--rs:10px;--font:'Gluten Variable','Gluten',ui-rounded,'Nunito','Segoe UI',system-ui,sans-serif;--rail:236px}
[data-theme=dark]{color-scheme:dark;--bg:#0d0c0d;--bg2:#131113;--panel:#171517;--panel2:#1e1b1e;--line:#2a262a;--line2:#3a353a;--tx:#f4efef;--mu:#aaa2a4;--mu2:#7d7578;--soft:rgba(250,78,80,.13);--shadow:0 14px 40px rgba(0,0,0,.5);--we:#171517;--chipmix:#fff;--glow:rgba(250,78,80,.11)}
[data-theme=light]{color-scheme:light;--bg:#faf5f4;--bg2:#f4ecea;--panel:#fff;--panel2:#fcf7f6;--line:#eadedc;--line2:#dccbc8;--tx:#2a1c1d;--mu:#7a6a6c;--mu2:#a2929a;--soft:rgba(250,78,80,.10);--shadow:0 14px 40px rgba(120,60,60,.14);--we:#f6eeec;--chipmix:#000;--glow:rgba(250,78,80,.08)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:15px;line-height:1.45;color:var(--tx);background:radial-gradient(900px 420px at 6% -8%,var(--glow),transparent 62%),var(--bg);-webkit-font-smoothing:antialiased;letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
a{color:inherit;text-decoration:none}h1,h2,h3,h4,p{margin:0}
::selection{background:var(--accent);color:var(--ink)}
*:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 82%,transparent)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 18px;font-size:19px;font-weight:700}
.brand img{width:38px;height:38px;border-radius:11px;box-shadow:0 0 0 1px var(--line)}
.rail nav{display:flex;flex-direction:column;gap:3px}
.nv{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--mu);font-weight:500;border:0;background:none;text-align:left;width:100%;transition:background .15s,color .15s}
.nv:hover{background:var(--panel2);color:var(--tx)}
.nv.on{background:var(--soft);color:var(--tx)}.nv.on .ico{color:var(--accent)}
.rail-foot{margin-top:auto;display:flex;gap:8px;align-items:center;padding:0 6px}
.main{padding:26px 40px 80px;min-width:0;max-width:1480px;width:100%;margin-inline:auto}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:32px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.tabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tab{padding:7px 15px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--mu);font-size:14px}
.tab:hover{color:var(--tx);border-color:var(--line2)}.tab.on{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);font-weight:500;transition:transform .08s,border-color .15s,background .15s}
.btn:hover{border-color:var(--mu2)}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mu)}.btn.ghost:hover{background:var(--panel2);color:var(--tx)}
.btn.danger{color:#ff7b7d}.btn.sm{padding:5px 11px;font-size:13px;border-radius:10px}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:var(--mu)}.ib:hover{background:var(--panel2);color:var(--tx)}
.kbd{border:1px solid var(--line2);border-radius:8px;padding:2px 7px;font-size:12px;color:var(--mu)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card h3{font-size:17px;font-weight:650;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.mut{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.wrap{flex-wrap:wrap}
.chip{--c:#8b8590;display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12.5px;line-height:1.5;white-space:nowrap;background:color-mix(in srgb,var(--c) 21%,transparent);color:color-mix(in srgb,var(--c) 58%,var(--chipmix));border:1px solid color-mix(in srgb,var(--c) 34%,transparent)}
.chip.pick{cursor:pointer;opacity:.55;background:transparent}.chip.pick:hover{opacity:.9}.chip.pick.on{opacity:1;background:color-mix(in srgb,var(--c) 30%,transparent)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--accent));display:inline-block;flex:none}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:9px;color:var(--mu);font-size:13.5px;display:flex;align-items:center;gap:6px}.seg button.on{background:var(--panel2);color:var(--tx);box-shadow:0 0 0 1px var(--line2)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}input[type=color]{padding:2px;height:34px;width:46px}
.tools input[type=search],.tools input[type=text]{width:240px}.tools select{width:auto}
table{border-collapse:collapse;width:100%}th{font-weight:600;color:var(--mu);font-size:13px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}th.s{cursor:pointer}th.s:hover{color:var(--tx)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tr.r{cursor:pointer}tr.r:hover td{background:var(--panel2)}
.tbl{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:auto}.tbl tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums}.rt{text-align:right}
.empty{padding:34px 20px;text-align:center;color:var(--mu)}.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:6px;font-weight:650}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);background:none;display:inline-grid;place-items:center;color:transparent;flex:none;padding:0}.chk:hover{border-color:var(--accent)}.chk.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.scrim{position:fixed;inset:0;background:rgba(5,3,4,.62);backdrop-filter:blur(4px);display:grid;place-items:start center;padding:7vh 16px;z-index:50;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:20px;box-shadow:var(--shadow);width:min(520px,100%);padding:24px;animation:pop .16s ease-out}.modal.wide{width:min(760px,100%)}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
.modal h2{font-size:21px;margin-bottom:16px;font-weight:700}.mf{display:flex;gap:8px;margin-top:20px;align-items:center}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}.f{display:flex;flex-direction:column;gap:6px}.f.full{grid-column:1/-1}.f>label{font-size:13px;color:var(--mu)}.chips{display:flex;flex-wrap:wrap;gap:6px}
.sugs{display:flex;gap:6px;margin-top:2px}.sugs button{border:1px solid var(--line);background:none;border-radius:8px;font-size:12px;color:var(--mu);padding:2px 8px}.sugs button:hover{color:var(--tx);border-color:var(--line2)}
details.adv{grid-column:1/-1}details.adv summary{cursor:pointer;color:var(--mu);font-size:13.5px;margin-bottom:12px}
.pop{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:190px;max-height:60vh;overflow:auto;animation:pop .12s ease-out}
.pitem{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;border:0;background:none;padding:7px 9px;border-radius:9px;text-align:left}.pitem:hover{background:var(--panel2)}.pitem.ghost{color:var(--mu);font-size:13px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:14px;z-index:90;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);animation:pop .18s}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;padding:0}
/* inicio */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
.hi{font-size:clamp(30px,4.2vw,48px);font-weight:750;letter-spacing:-.02em;line-height:1.06}.hi small{display:block;font-size:17px;font-weight:450;color:var(--mu);letter-spacing:0;margin-top:10px}
.now{display:inline-flex;align-items:center;gap:10px;margin:18px 0 22px;padding:9px 16px;border-radius:999px;background:var(--soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pl 2s infinite}@keyframes pl{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.ribbon{position:relative;display:grid;grid-template-columns:48px 1fr;gap:0 12px}
.rb{--c:#888;border-radius:12px;padding:8px 12px;background:color-mix(in srgb,var(--c) 22%,var(--panel));border-left:4px solid var(--c);min-height:30px;display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:4px}
.rb.past{opacity:.45}.rb.cur{box-shadow:0 0 0 2px var(--accent)}
.rt-t{font-size:12.5px;color:var(--mu);padding-top:9px;text-align:right}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:22px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}.stat b{display:block;font-size:30px;font-weight:750;letter-spacing:-.02em;line-height:1.1}.stat span{color:var(--mu);font-size:13px}
.col{display:flex;flex-direction:column;gap:16px}
.li{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line)}.li:last-child{border:0}.li .t{flex:1;min-width:0}.li .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due{font-size:12.5px;color:var(--mu);white-space:nowrap}.due.hot{color:var(--accent);font-weight:650}.due.late{color:#ff7b7d;font-weight:650}
.start{border:1.5px dashed color-mix(in srgb,var(--accent) 55%,transparent);border-radius:var(--r);padding:20px;margin-bottom:20px;background:var(--soft)}
/* estudios */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow:auto;padding-bottom:10px;align-items:start}
.bcol{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:140px}.bcol.over{border-color:var(--accent);background:var(--soft)}
.bcol h4{font-size:14px;margin:2px 4px 12px;display:flex;align-items:center;gap:8px}.bcol h4 .n{color:var(--mu);font-weight:400}
.bc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;cursor:grab}.bc:hover{border-color:var(--line2)}.bc.drag{opacity:.4}
.bc .tt{font-weight:600;margin-bottom:8px}.bc .row{gap:6px;flex-wrap:wrap}
.cnt{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.cd{--c:#888;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 24%,var(--panel)),var(--panel));border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));border-radius:var(--r);padding:16px 18px}.cd b{font-size:34px;display:block;line-height:1.1;font-weight:750}.cd .tt{font-weight:600;margin-top:6px}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.ac{--c:#888;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.ac header{padding:16px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,var(--panel)),color-mix(in srgb,var(--c) 8%,var(--panel)));display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line)}
.ac h3{font-size:17px;margin:0;flex:1;line-height:1.25}.ac .bd{padding:14px 18px;display:grid;gap:10px}.kv{display:flex;gap:10px;font-size:14px}.kv span:first-child{color:var(--mu);width:84px;flex:none}
.nota{font-size:34px;font-weight:750;line-height:1}.nl{font-size:13.5px;margin-top:6px}.nl b{font-weight:650;margin-right:6px}.nl i{font-style:normal;color:var(--mu2);margin:0 5px}
/* calendarios */
.mh{display:flex;align-items:center;gap:10px;margin-bottom:14px}.mh h2{font-size:22px;font-weight:700;min-width:190px}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.mg .wd{font-size:13px;color:var(--mu);text-align:center;padding:4px 0}
.dc{--c:transparent;position:relative;min-height:96px;border-radius:12px;padding:6px 8px;background:color-mix(in srgb,var(--c) 34%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 45%,var(--line));cursor:pointer;overflow:hidden;font-size:13px}
.dc.we{background:repeating-linear-gradient(135deg,var(--we),var(--we) 6px,var(--panel2) 6px,var(--panel2) 12px);border-color:var(--line)}.dc.we[style*="--c:#"]{background:color-mix(in srgb,var(--c) 34%,var(--panel))}
.dc.out{opacity:.4}.dc.today{box-shadow:0 0 0 2px var(--accent)}.dc:hover{border-color:var(--mu2)}
.dc .n{font-weight:650}.dc .lb{display:block;margin-top:6px;font-weight:700;font-size:12.5px;line-height:1.2;text-align:center}
.pill{--c:#888;display:block;margin-top:3px;padding:1px 7px;border-radius:7px;font-size:12px;background:color-mix(in srgb,var(--c) 30%,transparent);border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg{display:flex;flex-wrap:wrap;gap:8px 16px;margin:16px 0}.leg span{display:flex;align-items:center;gap:7px;font-size:13.5px}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.mini{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}.mini:hover{border-color:var(--accent)}.mini h4{font-size:14px;margin-bottom:8px}
.mm{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:10.5px;text-align:center}.mm i{--c:transparent;font-style:normal;border-radius:4px;padding:3px 0;background:color-mix(in srgb,var(--c) 55%,transparent)}.mm i.we{background:var(--we)}.mm i.e{opacity:.2}
.split{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:start}
/* horarios */
.sgw{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;overflow:auto}
.sg{display:grid;position:relative;user-select:none;min-width:620px}
.sg .hd{text-align:center;font-weight:650;padding:6px 0 10px;color:var(--mu)}.sg .hd.today{color:var(--accent)}
.sg .tm{font-size:12px;color:var(--mu);text-align:right;padding-right:10px;margin-top:-8px}
.sg .cell{cursor:pointer;display:flex}.sg .fill{flex:1;margin:2px 2px;border-radius:9px;background:color-mix(in srgb,var(--c,transparent) 38%,var(--panel2));border:1px dashed var(--line);transition:filter .1s}
.sg .cell.v .fill{border:1px solid color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 50%,var(--panel))}
.sg .cell:hover .fill{filter:brightness(1.18)}
.sg .cell.mt .fill{margin-top:0;border-top-left-radius:0;border-top-right-radius:0;border-top-color:transparent}.sg .cell.mb .fill{margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent}
.sg .lab{pointer-events:none;display:grid;place-items:center;text-align:center;font-weight:650;font-size:13.5px;line-height:1.2;padding:2px 8px;z-index:2;color:var(--tx);text-shadow:0 1px 0 rgba(0,0,0,.18)}
.sg.s24 .lab{font-size:11.5px}.sg .rec{pointer-events:none;display:grid;place-items:center;color:var(--mu);font-weight:600;letter-spacing:.05em;z-index:2}
.sg .recb{margin:2px;border-radius:9px;background:repeating-linear-gradient(135deg,var(--we),var(--we) 7px,var(--panel2) 7px,var(--panel2) 14px);border:1px solid var(--line)}
.nowl{position:relative;pointer-events:none;z-index:3}.nowl i{position:absolute;left:0;right:0;height:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.brush{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.brush .chip.pick{padding:4px 12px;font-size:13.5px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.sum .li{padding:7px 0}.sum .li span:last-child{font-weight:650}

.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}

.ss .tt{font-weight:650;font-size:14px;line-height:1.25}.ss .km{font-size:13px;color:var(--mu)}
.addb{margin-top:auto;border:1.5px dashed var(--line2);background:none;border-radius:10px;color:var(--mu2);padding:6px;font-size:13px}.addb:hover{color:var(--accent);border-color:var(--accent)}

.pbx{--c:#888;display:flex;justify-content:space-between;gap:6px;align-items:center;margin-top:3px;padding:1px 7px;border-radius:7px;font-size:11.5px;background:color-mix(in srgb,var(--c) 32%,transparent);border-left:3px solid var(--c)}.pbx.d{opacity:.5}
.pbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}

.pb .big{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:10px 0 4px}.pb .big sup{font-size:.5em;color:var(--accent)}

.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px}.chart svg{width:100%;height:auto;display:block;overflow:visible}.chart text{fill:var(--mu);font-size:11px;font-family:var(--font)}
.chart .grid{stroke:var(--line);stroke-width:1}

.ls{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}.ol{display:flex;gap:8px;align-items:center;margin-bottom:8px}.ol input[type=text]{flex:1}.ol input[type=number]{width:84px}.sw1{width:30px;height:30px;border-radius:9px;border:2px solid var(--line2);flex:none;padding:0}

.mh2{display:flex;align-items:center;gap:12px;margin:26px 2px 10px}.mh2 h3{font-size:17px;margin:0}.mh2 .chk{width:24px;height:24px}

.mdone{text-align:center;padding:26px;color:var(--mu)}.mdone b{display:block;color:var(--accent);font-size:20px;margin-bottom:4px}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login .card{max-width:430px;width:100%;text-align:center;padding:34px}.login img{width:84px;height:84px;border-radius:22px;margin-bottom:18px;box-shadow:0 0 0 1px var(--line)}

 th,td{padding:9px}.mrow .tp{font-size:10.5px;padding:2px 7px}.mrow .txt{font-size:15px}.grip{width:24px}

}

'use strict';
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pISO=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const hoy=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const lunes=d=>addD(d,-((d.getDay()+6)%7));
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const fDia=(s,o={day:'numeric',month:'short'})=>{const d=pISO(s);return d?d.toLocaleDateString('es-ES',o):''};
const fES=s=>{const d=pISO(s);return d?`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`:''};
const dif=s=>{const d=pISO(s);return d?Math.round((d-hoy())/864e5):0};
const rel=s=>{const n=dif(s);return n===0?'hoy':n===1?'mañana':n===-1?'ayer':n>1?`en ${n} días`:`hace ${-n} días`};
const toMin=h=>{const m=/^(\d{1,2}):(\d{2})/.exec(h||'');return m?+m[1]*60+ +m[2]:0};
const hm=m=>`${pad(Math.floor(m/60)%24)}:${pad(m%60)}`;
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const fmtN=n=>n===''||n==null||isNaN(n)?'':String(Math.round(n*100)/100);
const fmt2=n=>(isNaN(+n)?0:+n).toFixed(2);
const nn=v=>v===''||v==null||isNaN(+v)?'':+v;

function ruta(){const [s,t]=location.hash.slice(1).split('/');const NI=navItems(),n=NI.find(x=>x.id===s)||NI[0];R={sec:n.id,tab:t&&n.tabs&&n.tabs.some(x=>x[0]===t)?t:(n.tabs?n.tabs[0][0]:'')};draw();window.scrollTo(0,0)}
const go=(s,t)=>{location.hash='#'+s+(t?'/'+t:'')};
const viewHTML=()=>(VIEWS[R.sec]||(()=>''))();
function railHTML(){return `<aside class="rail"><a class="brand" href="#inicio"><img alt="" src="${LOGO}"><span>${esc(S.aj.nombre)} HQ</span></a><nav aria-label="Secciones" style="--n:${navItems().length}">${navItems().map(x=>`<a class="nv${x.id===R.sec?' on':''}" href="#${x.id}" title="${x.l}" aria-label="${x.l}">${ico(x.i,22)}<span class="l">${x.l}</span><span class="s">${x.s||x.l}</span></a>`).join('')}</nav><div class="rail-foot"><button class="ib" data-act="tema" title="Cambiar tema" aria-label="Cambiar tema">${ico(document.documentElement.dataset.theme==='dark'?'sun':'moon',19)}</button><button class="kbd" data-act="paleta" title="Apuntar rápido">Ctrl K</button></div></aside>`}
function topHTML(){const n=navItems().find(x=>x.id===R.sec)||navItems()[0];return `<header class="top"><div class="tt"><h1>${n.l}</h1>${n.tabs?`<nav class="tabs" aria-label="Apartados">${n.tabs.map(([t,l])=>`<a class="tab${t===R.tab?' on':''}" href="#${n.id}/${t}">${l}</a>`).join('')}</nav>`:''}</div><div class="row">${typeof syBadge==='function'?syBadge():''}${esInv()?'':`<button class="btn primary" data-act="paleta">${ico('plus',17)}Apuntar</button>`}</div></header>`}
function shell(){$('#app').innerHTML=`<div class="shell">${railHTML()}<main class="main">${topHTML()}<section id="main"></section></main></div>${esInv()?'':`<button class="fab" data-act="paleta" aria-label="Apuntar rápido">${ico('plus',26)}</button>`}`;document.body.classList.toggle('guest',esInv());$('#main').innerHTML=viewHTML();if(esInv())guestPolish($('#main'));tabVisible()}
function tabVisible(){const t=$('.tab.on');if(t&&t.scrollIntoView)try{t.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}}
/* al navegar solo se actualiza la cabecera y el contenido: el menú no se vuelve a dibujar */
function draw(){const y=window.scrollY;if(!$('.rail')||!$('.top')||!$('#main')){shell()}else{$$('.rail .nv').forEach((a,i)=>a.classList.toggle('on',navItems()[i]&&navItems()[i].id===R.sec));$('.top').outerHTML=topHTML();$('#main').innerHTML=viewHTML();if(esInv())guestPolish($('#main'));tabVisible()}window.scrollTo(0,y)}
function refresh(){const y=window.scrollY;$('#main').innerHTML=(VIEWS[R.sec]||(()=>''))();if(esInv())guestPolish($('#main'));window.scrollTo(0,y)}

/* ============ paleta rápida (Ctrl+K / N) ============ */
const COMANDOS=()=>[
 {l:'Nueva tarea',i:'check',f:()=>tareaForm({})},{l:'Nuevo examen',i:'flag',f:()=>tareaForm({tipo:'Examen'})},{l:'Nueva práctica / trabajo',i:'book',f:()=>tareaForm({tipo:'Trabajo'})},
 {l:'Apuntar entreno',i:'run',f:()=>planForm({fecha:iso(hoy())})},{l:'Nueva carrera',i:'trophy',f:()=>carreraForm({})},
 {l:'Registro de hoy',i:'pulse',f:()=>{U.ctl={fecha:iso(hoy())};go('control','registro')}},{l:'Nuevo evento del calendario escolar',i:'cal',f:()=>eventoForm({ini:iso(hoy())})},{l:'Nuevo cumpleaños',i:'cal',f:()=>cumpleForm({})},
 ...NAV.flatMap(n=>n.tabs?n.tabs.map(([t,l])=>({l:`Ir a ${n.l} · ${l}`,i:n.i,f:()=>go(n.id,t)})):[{l:`Ir a ${n.l}`,i:n.i,f:()=>go(n.id)}])];
let _pal=0;
function paleta(){if(esInv())return;const m=modal(`<input id="pq" type="text" placeholder="Escribe una tarea y pulsa Enter, o busca una acción…" autocomplete="off" style="font-size:17px;padding:12px 14px"><div id="pl" style="margin-top:10px"></div>`);const q=$('#pq',m),pl=$('#pl',m);let cur=[];
 const pinta=()=>{const t=norm(q.value);cur=COMANDOS().filter(c=>norm(c.l).includes(t)).slice(0,9);if(q.value.trim())cur.unshift({l:`Apuntar tarea: “${q.value.trim()}”`,i:'plus',f:()=>{const x={id:uid(),titulo:q.value.trim(),asignatura:'',tipo:'Tarea',fecha:'',estado:'Por hacer',prioridad:'',nota:'',resultado:'',notas:''};S.tareas.push(x);save();refresh();toast('Tarea apuntada',()=>tareaForm(x),'Añadir detalles')}});
  pl.innerHTML=cur.map((c,i)=>`<button class="pitem" data-i="${i}" style="padding:10px 12px">${ico(c.i,17)}<span style="flex:1;margin-left:10px">${esc(c.l)}</span></button>`).join('')};
 q.addEventListener('input',pinta);pinta();
 const run=i=>{const c=cur[i];if(c){closeModal();c.f()}};
 pl.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)run(+b.dataset.i)});
 q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();run(0)}});q.focus()}
ACT.paleta=()=>paleta();
document.addEventListener('keydown',e=>{const t=e.target.tagName;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();paleta()}else if(e.key==='n'&&!e.ctrlKey&&!e.metaKey&&!/INPUT|TEXTAREA|SELECT/.test(t)&&!$('.scrim')){e.preventDefault();paleta()}});

/* ============ ESTUDIOS ============ */
U.tar={vista:'lista',filtro:'pend',asig:'',q:'',orden:'prox',grupo:'prioridad'};
const _hn=new Date();U.tarCal={y:_hn.getFullYear(),m:_hn.getMonth()};

function autoTarea(x){
 if(x.tipo==='Recuperación'&&!x.prioridad)x.prioridad='Máxima';
 if(x.nota!==''&&x.nota!=null||x.resultado){x.estado='Calificado'}
 else if(x.estado==='Hecho'&&esEv(x.tipo))x.estado='Sin calificar';
 else if(x.estado==='Sin calificar'&&!esEv(x.tipo))x.estado='Hecho';
 return x}
function tareaForm(t){
 const nueva=!t.id;let obj=nueva?null:t;const v={titulo:'',tipo:'Tarea',asignatura:'',fecha:'',prioridad:'',estado:'Por hacer',nota:'',resultado:'',notas:'',...t};
 const fm=formModal({title:nueva?(v.tipo==='Examen'?'Nuevo examen':'Nueva tarea'):'Editar',values:v,
  fields:[{k:'titulo',l:'Título',ph:'Ej. Examen UD1 · Entregar práctica 2',full:1},{k:'tipo',l:'Tipo',t:'chips',o:'tipo',full:1},{k:'asignatura',l:'Asignatura',t:'chips',o:'asignatura',full:1},{k:'fecha',l:'Fecha',t:'date'},{k:'prioridad',l:'Prioridad',t:'chips',o:'prioridad'},
   {k:'estado',l:'Estado',t:'chips',o:'estado',full:1,adv:esInv()?0:1},{k:'nota',l:'Nota',t:'number',step:'0.01',min:0,max:10,adv:1},{k:'resultado',l:'Resultado (apto / no apto)',t:'chips',o:'resultado',adv:1},{k:'notas',l:'Temario / notas',t:'area',full:1,adv:1}].filter(f=>!esInv()||!f.adv),
  nuevo:nueva,apply:r=>{if(!r.titulo)return 'Ponle un título';if(!obj){obj=autoTarea({id:uid(),...r});S.tareas.push(obj)}else Object.assign(obj,autoTarea({...obj,...r}))},
  onDelete:nueva?null:()=>{const i=S.tareas.indexOf(t);S.tareas.splice(i,1);save();refresh();toast('Eliminado',()=>{S.tareas.splice(i,0,t);save();refresh()})}});
 fm.form.addEventListener('chipchange',e=>{if(e.detail.k==='tipo'&&e.detail.v==='Recuperación'&&!$('[data-k=prioridad] .chip.on',fm.form)){const c=$('[data-k=prioridad] .chip[data-v="Máxima"]',fm.form);if(c)c.classList.add('on')}})}
const tById=id=>S.tareas.find(t=>t.id===id);
ACT.tedit=b=>{const t=tById(b.dataset.id);if(t)tareaForm(t)};
ACT.tnew=b=>tareaForm({fecha:b.dataset.d||'',tipo:b.dataset.tipo||'Tarea'});
ACT.tdone=(b,e)=>{e.stopPropagation();const t=tById(b.dataset.id);if(!t)return;t.estado=esPend(t.estado)?(esEv(t.tipo)?'Sin calificar':'Hecho'):'Por hacer';save();refresh()};
ACT.tpick=(b,e)=>{e.stopPropagation();const t=tById(b.dataset.id),f=b.dataset.f;pick(b,f==='asignatura'?'asignatura':f,t[f],v=>{t[f]=v;Object.assign(t,autoTarea(t));save();refresh()})};
function tareasFiltradas(ev){let L=S.tareas.slice();const f=U.tar;if(ev)L=L.filter(t=>esEv(t.tipo));
 if(f.filtro==='pend')L=L.filter(t=>esPend(t.estado));if(f.filtro==='hechas')L=L.filter(t=>!esPend(t.estado));
 if(f.asig)L=L.filter(t=>t.asignatura===f.asig);if(f.q){const q=norm(f.q);L=L.filter(t=>norm(`${t.titulo} ${t.notas} ${t.asignatura} ${t.tipo}`).includes(q))}
 const hy=iso(hoy()),pr=n=>{const i=opts('prioridad').findIndex(x=>x.n===n);return i<0?99:i},fd=t=>t.fecha||'9999-12-31';
 if(f.orden==='prox'){const g=t=>esPend(t.estado)&&t.fecha&&t.fecha<hy?0:(t.fecha>=hy||!t.fecha)?1:2;L.sort((a,b)=>g(a)-g(b)||(g(a)===2?fd(b).localeCompare(fd(a)):fd(a).localeCompare(fd(b)))||pr(a.prioridad)-pr(b.prioridad))}
 else if(f.orden==='fa')L.sort((a,b)=>fd(a).localeCompare(fd(b)));else if(f.orden==='fd')L.sort((a,b)=>fd(b).localeCompare(fd(a)));else L.sort((a,b)=>pr(a.prioridad)-pr(b.prioridad)||fd(a).localeCompare(fd(b)));
 return L}
const dueTxt=t=>{if(!t.fecha)return '<span class="due">sin fecha</span>';const n=dif(t.fecha),p=esPend(t.estado);return `<span class="due ${p&&n<0?'late':p&&n<=2?'hot':''}">${fDia(t.fecha,{day:'numeric',month:'short'})} · ${rel(t.fecha)}</span>`};
const chk=t=>`<button class="chk ${esPend(t.estado)?'':'on'}" data-act="tdone" data-id="${t.id}" aria-label="Marcar como hecha">${ico('check',13)}</button>`;
function tareasLista(L){if(!L.length)return `<div class="empty"><b>Nada por aquí</b>Pulsa “Apuntar” o escribe N para añadir una tarea o un examen.</div>`;
 return `<div class="tbl"><table><thead><tr><th></th><th>Tarea</th><th>Asignatura</th><th>Tipo</th><th>Fecha</th><th>Prioridad</th><th>Estado</th><th class="rt">Nota</th></tr></thead><tbody>${L.map(t=>`<tr class="r" data-act="tedit" data-id="${t.id}"><td>${chk(t)}</td><td style="min-width:200px"><b>${esc(t.titulo)}</b></td><td><span data-act="tpick" data-f="asignatura" data-id="${t.id}">${chip('asignatura',t.asignatura)||'<span class="mut xs">—</span>'}</span></td><td><span data-act="tpick" data-f="tipo" data-id="${t.id}">${chip('tipo',t.tipo)||'—'}</span></td><td>${dueTxt(t)}</td><td><span data-act="tpick" data-f="prioridad" data-id="${t.id}">${chip('prioridad',t.prioridad)||'<span class="mut xs">—</span>'}</span></td><td><span data-act="tpick" data-f="estado" data-id="${t.id}">${chip('estado',t.estado)}</span></td><td class="rt num">${t.nota!==''&&t.nota!=null?`<b>${fmtN(t.nota)}</b>`:(t.resultado?chip('resultado',t.resultado):'<span class="mut">—</span>')}</td></tr>`).join('')}</tbody></table></div>`}
function tareasBoard(L){const g=U.tar.grupo,lista={prioridad:'prioridad',estado:'estado',asignatura:'asignatura',tipo:'tipo'}[g];
 const cols=opts(lista).map(o=>({n:o.n,c:P(o.c),L:L.filter(t=>t[g]===o.n)}));const sin=L.filter(t=>!t[g]);if(sin.length||g==='prioridad')cols.push({n:'Sin '+g,c:'#8b8590',L:sin,v:''});
 return `<div class="board">${cols.map(c=>`<div class="bcol" data-v="${esc(c.v!==undefined?c.v:c.n)}"><h4><span class="dot" style="--c:${c.c}"></span>${esc(c.n)} <span class="n">${c.L.length}</span></h4>${c.L.map(t=>`<div class="bc" draggable="true" data-act="tedit" data-id="${t.id}"><div class="tt">${esc(t.titulo)}</div><div class="row">${g!=='asignatura'?chip('asignatura',t.asignatura):''}${g!=='tipo'?chip('tipo',t.tipo):''}${t.fecha?dueTxt(t):''}</div></div>`).join('')||'<div class="mut xs" style="padding:6px 4px">Suelta aquí</div>'}</div>`).join('')}</div>`}
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.bc');if(c){e.dataTransfer.setData('text/plain',c.dataset.id);c.classList.add('drag')}});
document.addEventListener('dragend',e=>{$$('.bc.drag,.bcol.over').forEach(x=>x.classList.remove('drag','over'))});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.bcol');if(c){e.preventDefault();$$('.bcol.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.bcol');if(!c)return;e.preventDefault();const t=tById(e.dataTransfer.getData('text/plain'));if(!t)return;t[U.tar.grupo]=c.dataset.v;Object.assign(t,autoTarea(t));save();refresh()});

/* utilidades de calendario mensual */
function mesCeldas(y,m){const a=lunes(new Date(y,m,1));const n=Math.ceil(((new Date(y,m+1,0)).getDate()+((new Date(y,m,1).getDay()+6)%7))/7)*7;return Array.from({length:n},(_,i)=>addD(a,i))}
function mesNav(obj,act,extra=''){return `<div class="mh"><button class="ib" data-act="${act}" data-v="-1" aria-label="Mes anterior">${ico('l')}</button><h2>${cap(MESES[obj.m])} ${obj.y}</h2><button class="ib" data-act="${act}" data-v="1" aria-label="Mes siguiente">${ico('r')}</button><button class="btn sm" data-act="${act}" data-v="0">Hoy</button><span class="sp"></span>${extra}</div>`}
function mesMover(obj,v){if(v==='0'){const n=new Date();obj.y=n.getFullYear();obj.m=n.getMonth()}else{const d=new Date(obj.y,obj.m+ +v,1);obj.y=d.getFullYear();obj.m=d.getMonth()}}
const WD=['L','M','X','J','V','S','D'];
function tareasCal(L){const {y,m}=U.tarCal;const by={};L.forEach(t=>{if(t.fecha)(by[t.fecha]=by[t.fecha]||[]).push(t)});const hy=iso(hoy());
 return `${mesNav(U.tarCal,'tcal')}<div class="mg">${WD.map(d=>`<div class="wd">${d}</div>`).join('')}${mesCeldas(y,m).map(d=>{const k=iso(d),it=by[k]||[],we=d.getDay()%6===0;return `<div class="dc${we?' we':''}${d.getMonth()!==m?' out':''}${k===hy?' today':''}" data-act="tnew" data-d="${k}"><span class="n">${d.getDate()}</span>${it.slice(0,3).map(t=>`<span class="pill" style="--c:${colOf('asignatura',t.asignatura)}" data-act="tedit" data-id="${t.id}" title="${esc(t.titulo)}">${esEv(t.tipo)?'⚑ ':''}${esc(t.titulo)}</span>`).join('')}${it.length>3?`<span class="xs mut">+${it.length-3} más</span>`:''}</div>`}).join('')}</div>`}
ACT.tcal=b=>{mesMover(U.tarCal,b.dataset.v);refresh()};
ACT.tvista=b=>{U.tar.vista=b.dataset.v;refresh()};ACT.tfiltro=b=>{U.tar.filtro=b.dataset.v;refresh()};
ACT.tgrupo=b=>{U.tar.grupo=b.dataset.v;refresh()};
ACT.tasig=b=>pick(b,'asignatura',U.tar.asig,v=>{U.tar.asig=v;refresh()});
INP.torden=el=>{U.tar.orden=el.value;refresh()};
INP.tq=el=>{U.tar.q=el.value;const t=$('#tlist');if(t)t.innerHTML=tareasVista(R.tab==='evaluaciones')};
function tareasVista(ev){const L=tareasFiltradas(ev),v=U.tar.vista;return v==='lista'?tareasLista(L):v==='tablero'?tareasBoard(L):tareasCal(L)}
function tareasUI(ev){const f=U.tar;
 return `<div class="tools">${seg([['lista','Lista','list'],['tablero','Tablero','board'],['calendario','Calendario','cal']],f.vista,'tvista')}${seg([['pend','Pendientes'],['todas','Todas'],['hechas','Hechas']],f.filtro,'tfiltro')}<button class="btn sm" data-act="tasig">${f.asig?chip('asignatura',f.asig):'Todas las asignaturas'}</button>${f.vista==='tablero'?seg([['prioridad','Por prioridad'],['estado','Por estado'],['asignatura','Por asignatura']],f.grupo,'tgrupo'):''}${f.vista==='lista'?`<select data-ch="torden" aria-label="Orden"><option value="prox" ${f.orden==='prox'?'selected':''}>Próximas primero</option><option value="fa" ${f.orden==='fa'?'selected':''}>Fecha ↑</option><option value="fd" ${f.orden==='fd'?'selected':''}>Fecha ↓</option><option value="pr" ${f.orden==='pr'?'selected':''}>Prioridad</option></select>`:''}<input type="search" placeholder="Buscar…" value="${esc(f.q)}" data-in="tq"><span class="sp"></span><button class="btn primary sm" data-act="tnew" data-tipo="${ev?'Examen':'Tarea'}">${ico('plus',15)}${ev?'Nueva evaluación':'Nueva tarea'}</button></div><div id="tlist">${tareasVista(ev)}</div>`}
function contadores(){const hy=iso(hoy());const L=S.tareas.filter(t=>esEv(t.tipo)&&esPend(t.estado)&&t.fecha>=hy).sort((a,b)=>a.fecha.localeCompare(b.fecha)).slice(0,3);
 if(!L.length)return '';return `<div class="cnt">${L.map(t=>{const n=dif(t.fecha);return `<div class="cd" style="--c:${colOf('asignatura',t.asignatura)}" data-act="tedit" data-id="${t.id}" role="button" tabindex="0"><span class="sm mut">${esc(t.tipo)} · ${esc(t.asignatura||'sin asignatura')}</span><b>${n===0?'Hoy':n===1?'Mañana':n+' días'}</b><div class="tt">${esc(t.titulo)}</div><span class="xs mut">${fDia(t.fecha,{weekday:'long',day:'numeric',month:'long'})}</span></div>`}).join('')}</div>`}

/* asignaturas */
const PLURAL={Examen:'Exámenes','Recuperación':'Recuperaciones','Práctica':'Prácticas','Exposición':'Exposiciones',Trabajo:'Trabajos'},ORD_EV=['Examen','Recuperación','Práctica','Exposición','Trabajo'];
function notasAsig(a){const tipos=opts('tipo').filter(t=>t.ev).map(t=>t.n).sort((x,y)=>{const i=ORD_EV.indexOf(x),j=ORD_EV.indexOf(y);return (i<0?99:i)-(j<0?99:j)});
 return tipos.map(tp=>({cat:PLURAL[tp]||tp+'s',items:S.tareas.filter(t=>t.asignatura===a&&t.tipo===tp).sort((x,y)=>(x.fecha||'').localeCompare(y.fecha||'')).map(t=>{const v=t.nota!==''&&t.nota!=null?fmtN(t.nota):(t.resultado||'');return `${t.titulo} - ${v}`.trim()})}))}
function mediaAsig(a){const n=S.tareas.filter(t=>t.asignatura===a&&esEv(t.tipo)&&t.nota!==''&&t.nota!=null).map(t=>+t.nota);return n.length?n.reduce((x,y)=>x+y,0)/n.length:null}
function asignaturasUI(){return `<div class="acards">${opts('asignatura').map(o=>{const a=o.n,d=S.asig[a]||{},man=d.notaTrim!==''&&d.notaTrim!=null&&d.notaTrim!==undefined,med=mediaAsig(a),pend=S.tareas.filter(t=>t.asignatura===a&&esPend(t.estado));const prox=pend.filter(t=>t.fecha).sort((x,y)=>x.fecha.localeCompare(y.fecha))[0];
 return `<article class="ac" style="--c:${P(o.c)}"><header><h3>${esc(a)}</h3><button class="ib" data-act="aedit" data-a="${esc(a)}" aria-label="Editar ${esc(a)}">${ico('edit',17)}</button></header><div class="bd">
 <div class="kv"><span>Profesor</span><span>${esc(d.profesor||'—')}</span></div>
 <div class="kv"><span>Correo</span><span>${d.correo?`<a href="mailto:${esc(d.correo)}" style="text-decoration:underline">${esc(d.correo)}</a> <button class="ib" style="width:26px;height:26px" data-act="acopy" data-c="${esc(d.correo)}" aria-label="Copiar correo">${ico('copy',14)}</button>`:'—'}</span></div>
 <div class="kv"><span>Horas / sem.</span><span>${esc(d.horas||'—')}</span></div>
 <div class="row" style="align-items:flex-end;margin-top:4px"><div><div class="nota">${man?fmtN(d.notaTrim):med!=null?fmtN(med):'—'}</div><div class="xs mut">${man?'nota del trimestre':med!=null?'media de lo calificado':'nota del trimestre'}</div></div><span class="sp"></span><div class="xs mut" style="text-align:right">${pend.length?`${pend.length} pendiente${pend.length>1?'s':''}`:'Al día'}${prox?`<br>próxima ${rel(prox.fecha)}`:''}</div></div>

 return `${!pb.length?`<div class="empty"><b>Todavía no hay marcas</b>Apunta una carrera con su marca y aquí aparecerá tu mejor tiempo por distancia.</div>`:''}<div class="pbs">${pb.map(x=>{const prin=x.of[0]||x.no[0],ast=!x.of.length,k=kmDe(prin);
  return `<article class="pb" style="--c:${P(x.o.c)}"><div class="row"><span class="chip" style="--c:${P(x.o.c)}">${esc(x.o.n)}</span><span class="sp"></span><span class="xs mut">${x.n} carrera${x.n>1?'s':''}</span></div><div class="big num">${esc(prin.marca)}${ast?'<sup>*</sup>':''}</div><div class="mut">${ritmo(secC(prin),k)} /km · ${esc(prin.nombre)}</div><div class="xs mut">${f(prin)}</div>
  ${x.of.length>1?`<div class="xs mut" style="margin-top:8px">Igualada también en: ${x.of.slice(1).map(c=>esc(c.nombre)+' ('+fES(c.fecha)+')').join(', ')}</div>`:''}
  ${ast?'<div class="xs mut" style="margin-top:8px">Aún sin marca homologada</div>':''}
  ${!ast&&x.no.length?`<div class="un">${x.no.map(c=>`<div class="row"><b class="num">${esc(c.marca)}*</b><span class="xs mut">${ritmo(secC(c),k)} /km · ${esc(c.nombre)}, ${fES(c.fecha)}</span></div>`).join('')}<div class="xs mut" style="margin-top:4px">* carrera sin homologar</div></div>`:''}</article>`}).join('')}</div>
 ${sin.length?`<p class="mut sm" style="margin-top:18px">Sin marca todavía: ${sin.map(o=>chip('distancia',o.n)).join(' ')}</p>`:''}
 ${Object.keys(porAnio).length?`<div class="card" style="margin-top:22px;max-width:520px"><h3>Carreras por año</h3>${Object.entries(porAnio).sort().reverse().map(([y,n])=>`<div class="row" style="margin:7px 0"><span class="num" style="width:44px">${y}</span><div class="bar"><i style="width:${n/mx*100}%"></i></div><b class="num" style="width:26px;text-align:right">${n}</b></div>`).join('')}</div>`:''}`}

/* ============ CARRERAS GUARDADAS (recuerdos + fotos y vídeos privados) ============ */
U.gd={id:null};
const MED={state:'init',key:null,info:null,lista:{},th:{},up:[],err:'',url:null};
const MAXV=40*1024*1024,TROZO=700000;
const medOK=()=>typeof Sync!=='undefined'&&SY.on&&SY.ws&&SY.user&&SY.ws.id===SY.user.uid&&SY.role==='owner';
const leerBuf=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(new Uint8Array(r.result));r.onerror=()=>rej(r.error);r.readAsArrayBuffer(b)});
/* clave recordada en este dispositivo (no extraíble) */
const idb=()=>new Promise((res,rej)=>{const q=indexedDB.open('juanhq-key',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const idbGet=async k=>{const d=await idb();return new Promise((res,rej)=>{const r=d.transaction('k').objectStore('k').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})};
const idbSet=async(k,v)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})};
const idbDel=async k=>{try{const d=await idb();d.transaction('k','readwrite').objectStore('k').delete(k)}catch(e){}};
/* cifrado AES-GCM; la clave sale de tu contraseña y nunca se envía a la nube */
async function kdf(pass,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function cifrar(u8,key){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,u8)),o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return o}
async function descifrar(u8,key){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8.slice(0,12)},key,u8.slice(12)))}
async function medCheck(k,info){const t=await descifrar(info.check,k);if(new TextDecoder().decode(t)!=='ok')throw new Error('clave')}
async function medInit(){if(!medOK()){MED.state='no';return}if(MED.key){MED.state='open';return}MED.state='cargando';
 try{MED.info=await Sync.keyInfo();if(!MED.info){MED.state='crear';return}
  try{const k=await idbGet('media-'+SY.user.uid);if(k){await medCheck(k,MED.info);MED.key=k;MED.state='open';return}}catch(e){}
  MED.state='bloqueada'}catch(e){MED.state='error';MED.err=e.message||String(e)}}
function medReset(){MED.state='init';MED.key=null;MED.info=null;MED.lista={};Object.values(MED.th).forEach(u=>URL.revokeObjectURL(u));MED.th={};MED.up=[];if(MED.url){URL.revokeObjectURL(MED.url);MED.url=null}}
async function medCargar(raceId){try{const L=await Sync.mediaList(raceId);MED.lista[raceId]=L;
 for(const m of L){if(MED.th[m.id]===undefined){try{const b=await descifrar(m.thumb,MED.key);MED.th[m.id]=b.length?URL.createObjectURL(new Blob([b],{type:'image/jpeg'})):''}catch(e){MED.th[m.id]=''}}}}
 catch(e){MED.lista[raceId]=[];MED.err=e.message||String(e)}}
async function medPurge(raceId){if(!medOK())return;try{for(const m of await Sync.mediaList(raceId))await Sync.mediaDel(m.id,m.parts)}catch(e){}delete MED.lista[raceId]}
/* compresión de fotos en el dispositivo */
async function comprimirImg(file,max,q){try{if(typeof createImageBitmap!=='function')return file;const bmp=await createImageBitmap(file),r=Math.min(1,max/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*r);c.height=Math.round(bmp.height*r);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
 return await new Promise(res=>c.toBlob(b=>res(b||file),'image/jpeg',q))}catch(e){return file}}
function thumbVideo(f){return new Promise(res=>{try{const v=document.createElement('video'),u=URL.createObjectURL(f);let done=false;const fin=b=>{if(done)return;done=true;URL.revokeObjectURL(u);res(b)};setTimeout(()=>fin(new Uint8Array(0)),6000);
 v.muted=true;v.playsInline=true;v.preload='metadata';v.onloadeddata=()=>{v.currentTime=Math.min(1,(v.duration||1)/2)};
 v.onseeked=()=>{try{const r=Math.min(1,320/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=Math.round(v.videoWidth*r);c.height=Math.round(v.videoHeight*r);c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(async b=>fin(b?await leerBuf(b):new Uint8Array(0)),'image/jpeg',.7)}catch(e){fin(new Uint8Array(0))}};v.onerror=()=>fin(new Uint8Array(0));v.src=u}catch(e){res(new Uint8Array(0))}})}
const updUp=()=>{const e=$('#gdup');if(e)e.innerHTML=upHTML()};
const upHTML=()=>MED.up.map(u=>`<div class="li"><div class="t"><div>${esc(u.name)}</div></div>${u.err?`<span class="due late">${esc(u.err)}</span>`:`<span class="due">${u.pct>=1?'Listo':Math.round(u.pct*100)+'%'}</span>`}</div>`).join('');
async function medSubir(raceId,f){const u={name:f.name||'archivo',pct:0,err:''};MED.up.push(u);updUp();
 try{const vid=(f.type||'').startsWith('video/');if(!vid&&!(f.type||'').startsWith('image/'))throw new Error('Solo fotos y vídeos');if(vid&&f.size>MAXV)throw new Error('Vídeo de más de 40 MB');
  let data,thumb,mime=f.type;
  if(vid){data=await leerBuf(f);thumb=await thumbVideo(f)}else{const j=await comprimirImg(f,1600,.78);mime=j.type||'image/jpeg';data=await leerBuf(j);thumb=await leerBuf(await comprimirImg(f,320,.7))}
  const ct=await cifrar(data,MED.key),th=await cifrar(thumb,MED.key),chunks=[];for(let i=0;i<ct.length;i+=TROZO)chunks.push(ct.slice(i,i+TROZO));
  const meta={id:'f'+uid(),raceId,kind:vid?'video':'foto',mime,size:data.length,ts:Date.now()};
  await Sync.mediaPut(meta,th,chunks,p=>{u.pct=p;updUp()});u.pct=1;updUp();delete MED.lista[raceId]}
 catch(e){u.err=e.message||'Error';updUp()}}
INP.gdfiles=async el=>{const files=[...el.files],id=U.gd.id;el.value='';if(!MED.key||!id)return;MED.up=[];for(const f of files)await medSubir(id,f);setTimeout(()=>{MED.up=[];refresh()},1500)};
ACT.gdcrearclave=async()=>{const a=($('#gdp1')||{}).value||'',b=($('#gdp2')||{}).value||'';if(a.length<8)return toast('Usa al menos 8 caracteres');if(a!==b)return toast('Las contraseñas no coinciden');
 try{const salt=crypto.getRandomValues(new Uint8Array(16)),k=await kdf(a,salt),check=await cifrar(new TextEncoder().encode('ok'),k);await Sync.setKeyInfo(salt,check);MED.info={salt,check};MED.key=k;MED.state='open';
  if(($('#gdrec')||{}).checked)idbSet('media-'+SY.user.uid,k).catch(()=>{});refresh()}catch(e){toast('No se pudo crear: '+e.message)}};
ACT.gdabrirclave=async()=>{const a=($('#gdp1')||{}).value||'';if(!a)return;try{const k=await kdf(a,MED.info.salt);await medCheck(k,MED.info);MED.key=k;MED.state='open';if(($('#gdrec')||{}).checked)idbSet('media-'+SY.user.uid,k).catch(()=>{});refresh()}catch(e){toast('Contraseña incorrecta')}};
ACT.gdbloquear=()=>{MED.key=null;MED.state='bloqueada';MED.lista={};Object.values(MED.th).forEach(u=>URL.revokeObjectURL(u));MED.th={};if(SY.user)idbDel('media-'+SY.user.uid);refresh();toast('Fotos y vídeos bloqueados')};
ACT.gdreintentar=()=>{MED.state='init';refresh()};
/* visor */
ACT.gdver=async b=>{const id=U.gd.id,L=MED.lista[id]||[],i=+b.dataset.i,m=L[i];if(!m||!MED.key)return;
 const mo=modal(`<div id="gdv" class="gdv"><p class="mut" style="padding:40px;text-align:center">Descifrando…</p></div><div class="mf"><button class="btn sm" data-act="gdprev" data-i="${i-1}" ${i<1?'disabled':''}>${ico('l',15)}</button><button class="btn sm" data-act="gdprev" data-i="${i+1}" ${i>=L.length-1?'disabled':''}>${ico('r',15)}</button><span class="sp"></span><button class="btn sm" data-act="gddesc" data-i="${i}">${ico('down',15)}Guardar en el dispositivo</button><button class="btn danger sm" data-act="gddel" data-i="${i}">Eliminar</button><button class="btn primary sm" onclick="closeModal()">Cerrar</button></div>`,true);
 try{const raw=await Sync.mediaGet(m.id,m.parts),dec=await descifrar(raw,MED.key);if(MED.url)URL.revokeObjectURL(MED.url);MED.url=URL.createObjectURL(new Blob([dec],{type:m.mime}));MED.cur={m,i};
  const v=$('#gdv',mo);if(v)v.innerHTML=m.kind==='video'?`<video src="${MED.url}" controls playsinline style="width:100%;max-height:68vh;border-radius:12px;background:#000"></video>`:`<img src="${MED.url}" alt="Foto" style="width:100%;max-height:68vh;object-fit:contain;border-radius:12px">`}
 catch(e){const v=$('#gdv',mo);if(v)v.innerHTML='<p class="due late" style="padding:30px;text-align:center">No se pudo abrir. Comprueba tu conexión y tu contraseña.</p>'}};
ACT.gdprev=b=>{const i=+b.dataset.i;ACT.gdver({dataset:{i}})};
ACT.gddesc=()=>{if(!MED.url||!MED.cur)return;const m=MED.cur.m,a=document.createElement('a');a.href=MED.url;a.download='recuerdo-'+m.id+'.'+(m.kind==='video'?(m.mime.split('/')[1]||'mp4'):'jpg');document.body.appendChild(a);a.click();a.remove()};
ACT.gddel=async b=>{const id=U.gd.id,m=(MED.lista[id]||[])[+b.dataset.i];if(!m||!confirm('¿Eliminar este archivo de forma definitiva?'))return;try{await Sync.mediaDel(m.id,m.parts);delete MED.lista[id];if(MED.th[m.id]){URL.revokeObjectURL(MED.th[m.id]);delete MED.th[m.id]}closeModal();refresh();toast('Eliminado')}catch(e){toast('No se pudo eliminar: '+e.message)}};

const gdFila=c=>`<button class="li" style="width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:inherit;cursor:pointer" data-act="gdguardar" data-id="${c.id}"><div class="t"><div><b>${esc(c.nombre)}</b></div><div class="xs mut">${c.fecha?fES(c.fecha.slice(0,10)):'sin fecha'}${c.lugar?' · '+esc(c.lugar):''}${c.marca?' · '+esc(c.marca):''}</div></div>${chip('distancia',c.distancia)}</button>`;

INP.gdrec=el=>{const c=cById(el.dataset.id);if(c){c.recuerdo=el.value;save()}};
function gdLista(){const L=gdSet();
 if(!L.length)return `<div class="empty"><b>Aquí guardas tus carreras más especiales</b>Marca las que te gustaron, las primeras de cada distancia o las que quieras recordar, y añade tus fotos y vídeos.<div style="margin-top:16px"><button class="btn primary" data-act="gdnuevo">${ico('plus',15)}Guardar una carrera</button></div></div>`;
 let y='',h=`<div class="tools"><span class="mut sm">${L.length} carrera${L.length>1?'s':''} guardada${L.length>1?'s':''} · de la más reciente a la más antigua</span><span class="sp"></span><button class="btn primary sm" data-act="gdnuevo">${ico('plus',15)}Nuevo</button></div>`;
 L.forEach(c=>{const a=(c.fecha||'').slice(0,4)||'Sin fecha';if(a!==y){y=a;h+=`<h3 class="gy">${a}</h3>`}
  h+=`<button class="gc" style="--c:${colOf('distancia',c.distancia)}" data-act="gdabrir" data-id="${c.id}"><div class="gcn">${esc(c.nombre)}</div><div class="xs mut">${c.fecha?cap(fDia(c.fecha.slice(0,10),{weekday:'short',day:'numeric',month:'long'})):'sin fecha'}${c.lugar?' · '+esc(c.lugar):''}</div><div class="row" style="margin-top:8px">${chip('distancia',c.distancia)}${c.marca?`<b class="num">${esc(c.marca)}</b>`:''}${c.marca&&!c.homologada?'<sup class="mut">*</sup>':''}</div></button>`});
 return h}
function gdMedia(c){const S0=MED.state;let b='';
 if(S0==='no')b=`<p class="mut sm">Las fotos y vídeos se guardan cifrados en tu nube privada, por eso solo están disponibles en la versión web con tu cuenta de Google (y en tu propio espacio, no en uno compartido).</p>`;
 else if(S0==='init'||S0==='cargando')b='<p class="mut sm">Cargando…</p>';
 else if(S0==='error')b=`<p class="due late">No se pudo conectar: ${esc(MED.err)}</p><button class="btn sm" data-act="gdreintentar">Reintentar</button>`;
 else if(S0==='crear')b=`<p class="sm" style="margin-bottom:12px">Elige una <b>contraseña solo para tus fotos y vídeos</b>. Se usa para cifrarlos antes de salir de tu dispositivo: nadie, ni siquiera quien accediera a tu base de datos, podrá verlos sin ella. <b>Si la olvidas, no se pueden recuperar.</b></p><div class="fg"><div class="f"><label>Contraseña (mín. 8 caracteres)</label><input id="gdp1" type="password" autocomplete="new-password"></div><div class="f"><label>Repítela</label><input id="gdp2" type="password" autocomplete="new-password"></div><label class="row full" style="grid-column:1/-1"><input type="checkbox" id="gdrec"> <span class="sm mut">Recordarla en este dispositivo</span></label></div><button class="btn primary" style="margin-top:14px" data-act="gdcrearclave">Crear y desbloquear</button>`;
 else if(S0==='bloqueada')b=`<p class="sm" style="margin-bottom:12px">Introduce la contraseña de tus fotos y vídeos.</p><div class="row wrap"><input id="gdp1" type="password" autocomplete="current-password" style="max-width:280px" placeholder="Contraseña"><button class="btn primary" data-act="gdabrirclave">Desbloquear</button></div><label class="row" style="margin-top:10px"><input type="checkbox" id="gdrec"> <span class="sm mut">Recordarla en este dispositivo</span></label>`;
 else{const L=MED.lista[c.id];
  b=`<div class="row wrap" style="margin-bottom:14px"><label class="btn primary sm" style="cursor:pointer">${ico('plus',15)}Añadir fotos o vídeos<input type="file" accept="image/*,video/*" multiple hidden data-ch="gdfiles"></label><span class="xs mut">Fotos comprimidas automáticamente · vídeos hasta 40 MB</span><span class="sp"></span><button class="btn ghost sm" data-act="gdbloquear">${ico('lock',15)}Bloquear</button></div><div id="gdup">${upHTML()}</div>
  ${L===undefined||L===null?'<p class="mut sm">Cargando tus recuerdos…</p>':L.length?`<div class="gal">${L.map((m,i)=>`<button class="gt" data-act="gdver" data-i="${i}" aria-label="Abrir ${m.kind}">${MED.th[m.id]?`<img src="${MED.th[m.id]}" alt="">`:`<span class="mut sm">${m.kind==='video'?'Vídeo':'Foto'}</span>`}${m.kind==='video'?'<span class="gv">▶</span>':''}</button>`).join('')}</div>`:'<p class="mut sm">Todavía no hay fotos ni vídeos. Añade la foto de la meta, la medalla, un mensaje de felicitación…</p>'}`}
 return `<div class="card" style="margin-top:16px"><h3>${ico('lock',18)}Fotos y vídeos<span class="sp"></span><span class="xs mut" style="font-weight:400">Privado · cifrado</span></h3>${b}</div>`}
function gdDetalle(c){const s=secC(c),k=kmDe(c),inf=infoCarreras(),pb=inf.isO.has(c.id)?`<span class="tag">${ico('trophy',13)}PB</span>`:inf.isN.has(c.id)?'<span class="tag">PB*</span>':'';
 const kv=(l,v,full)=>v!==''&&v!=null?`<div class="kv${full?' full':''}"><span>${l}</span><span>${v}</span></div>`:'';
 return `<div class="mh"><button class="btn sm" data-act="gdback">${ico('l',15)}Carreras guardadas</button><span class="sp"></span><button class="btn sm" data-act="cedit" data-id="${c.id}">${ico('edit',15)}Editar carrera</button><button class="btn ghost sm" data-act="gdquitar" data-id="${c.id}">Quitar de guardadas</button></div>
 <div class="card"><div class="row wrap" style="margin-bottom:14px"><h2 style="font-size:26px">${esc(c.nombre)}</h2>${chip('distancia',c.distancia)}${chip('prioCarrera',c.prioridad)}</div>
 <div class="gk">${kv('Fecha',c.fecha?`${cap(fDia(c.fecha.slice(0,10),{weekday:'long',day:'numeric',month:'long',year:'numeric'}))}${c.fecha.length>10&&c.fecha.slice(11,16)!=='00:00'?' · '+c.fecha.slice(11,16):''}`:'')}${kv('Lugar',esc(c.lugar))}${kv('Marca',c.marca?`<b class="num">${esc(c.marca)}</b>${c.homologada?'':'<sup>*</sup>'} ${pb}`:'')}${kv('Ritmo',s&&k?ritmo(s,k)+' /km':'')}${kv('Homologada',c.homologada?'Sí':'No *')}${kv('Puesto histórico',inf.pos[c.id]?`${inf.pos[c.id]}º de ${inf.tot[c.distancia]} en ${esc(c.distancia)}`:'')}${kv('Posición',esc(c.posicion))}${kv('Posición en categoría',esc(c.posCat))}${kv('FC media',c.fc?esc(c.fc)+' ppm':'')}${kv('Notas',esc(c.notas),1)}</div></div>
 <div class="card" style="margin-top:16px"><h3>Mi recuerdo</h3><textarea rows="3" data-in="gdrec" data-id="${c.id}" placeholder="¿Por qué es especial esta carrera?">${esc(c.recuerdo||'')}</textarea></div>${gdMedia(c)}`}

function chart({data,kind,cols,min,max,ref,h=180,fmt=v=>fmtN(v)}){const W=560,L=38,Rr=8,T=10,B=26,iw=W-L-Rr,ih=h-T-B,n=data.length;
 const tot=data.map(d=>kind==='bars'?(d.y.some(v=>v!=null&&v!=='')?d.y.reduce((a,b)=>a+(+b||0),0):null):d.y[0]);const vals=tot.filter(v=>v!=null&&v!=='');
 if(!vals.length)return '<div class="empty" style="padding:30px">Sin datos en este periodo</div>';
 let lo=min!=null?min:(kind==='bars'?0:Math.min(...vals)),hi=max!=null?max:Math.max(...vals);
 if(min==null&&kind==='line'){const p=(hi-lo||1)*.3;lo-=p;hi+=p}else if(max==null)hi=hi*1.12||1;if(ref!=null&&ref>hi)hi=ref*1.05;
 const Y=v=>T+ih-(v-lo)/(hi-lo)*ih,X=i=>L+(i+.5)*iw/n;let g='';
 for(let t=0;t<=4;t++){const v=lo+(hi-lo)*t/4,y=Y(v);g+=`<line class="grid" x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${fmt(v)}</text>`}
 const step=Math.ceil(n/8);data.forEach((d,i)=>{if(i%step===0||i===n-1)g+=`<text x="${X(i)}" y="${h-7}" text-anchor="middle">${d.x}</text>`});
 if(ref!=null)g+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(ref)}" y2="${Y(ref)}" stroke="var(--accent)" stroke-dasharray="5 5" opacity=".7"/>`;
 if(kind==='bars'){const bw=Math.max(3,Math.min(34,iw/n*.62));data.forEach((d,i)=>{let acc=0;d.y.forEach((v,s)=>{v=+v;if(!v)return;const y0=Y(acc),y1=Y(acc+v);g+=`<rect x="${X(i)-bw/2}" y="${y1}" width="${bw}" height="${Math.max(0,y0-y1)}" rx="3" fill="${cols[s]}"><title>${d.x}: ${fmt(v)}</title></rect>`;acc+=v})})}
 else{let path='',pen=false;data.forEach((d,i)=>{const v=d.y[0];if(v==null||v===''){pen=false;return}path+=`${pen?'L':'M'}${X(i)} ${Y(v)} `;pen=true});g+=`<path d="${path}" fill="none" stroke="${cols[0]}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;data.forEach((d,i)=>{const v=d.y[0];if(v!=null&&v!=='')g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${cols[0]}"><title>${d.x}: ${fmt(v)}</title></circle>`})}
 return `<svg viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`}
function ctlGraficos(){const n=U.ctl.rango,days=Array.from({length:n},(_,i)=>addD(hoy(),i-n+1));const S1=fn=>days.map(d=>{const e=ctlGet(iso(d))||{};return {x:`${pad(d.getDate())}/${pad(d.getMonth()+1)}`,y:fn(e)}});
 const num=v=>v===''||v==null?null:+v;const media=k=>{const a=avg(days.map(d=>(ctlGet(iso(d))||{})[k]));return a!=null?`media ${fmtN(a)}`:''};
 const card=(t,sub,svg)=>`<div class="card chart"><h3>${t}<span class="sp"></span><span class="xs mut" style="font-weight:400">${sub}</span></h3>${svg}</div>`;
 return `<div class="tools">${seg([['7','7 días'],['14','14 días'],['30','30 días'],['90','90 días']],String(n),'crango')}</div><div class="charts">
 ${card('Sueño y siesta',media('sueno')+' h · línea = 8 h',chart({data:S1(e=>[num(e.sueno),num(e.siesta)]),kind:'bars',cols:[P('Cielo'),P('Lila')],ref:8}))}
 ${card('Fatiga',media('fatiga'),chart({data:S1(e=>[num(e.fatiga)]),kind:'line',cols:[S.aj.acento],min:0,max:5}))}
 ${card('Horas de estudio',media('estudio'),chart({data:S1(e=>[num(e.estudio)]),kind:'bars',cols:[P('Turquesa')]}))}
 ${card('FC en reposo',media('fc'),chart({data:S1(e=>[num(e.fc)]),kind:'line',cols:[P('Amarillo')],fmt:v=>Math.round(v)}))}
 ${card('Peso',media('peso'),chart({data:S1(e=>[num(e.peso)]),kind:'line',cols:[P('Rosa')]}))}</div>`}

 const r0=rows.map(r=>{const b=r.getBoundingClientRect();return b.top+scrollY+b.height/2});
 dg={row,box,rows,r0,i0:rows.indexOf(row),i:rows.indexOf(row),y0:e.pageY,h:row.offsetHeight+0,cy:e.clientY,sec:box.dataset.sec};row.classList.add('drag');dg.t=setInterval(()=>{if(dg.cy<90)scrollBy(0,-14);else if(dg.cy>innerHeight-90)scrollBy(0,14)},16)});

 control:['Control diario',[['fecha','Fecha'],['sueno','Horas sueño'],['siesta','Horas siesta'],['fatiga','Fatiga'],['molestias','Molestias'],['fc','FC reposo'],['peso','Peso'],['estudio','Horas estudio'],['notas','Notas']]],
 plan:['Plan de running',[['fecha','Fecha'],['sesion','Sesión'],['km','Km'],['detalle','Detalle'],['hecho','Hecho']]],
 eventos:['Calendario escolar',[['nombre','Evento'],['ini','Desde'],['fin','Hasta'],['cat','Categoría']]],
 cumples:['Cumpleaños',[['nombre','Nombre'],['dia','Día'],['mes','Mes'],['anio','Año'],['cat','Importancia'],['notas','Notas']]]};
const ALIAS={titulo:['tarea','titulo','nombre'],nombre:['carrera','nombre','evento'],ini:['desde','fecha inicio','fecha','inicio'],fin:['hasta','fecha fin','fin'],cat:['categoria','cat'],sueno:['horas sueno','sueno'],siesta:['horas siesta','siesta'],fatiga:['fatiga 1-5','fatiga'],fc:['fc reposo','fc media','fc'],estudio:['horas estudio','estudio'],km:['km','distancia'],posCat:['posicion cat','pos cat'],fecha:['fecha','fecha entrega','dia'],sesion:['sesion'],homologada:['homologada','homologado'],hecho:['hecho']};
const LISTA_DE={tareas:{asignatura:'asignatura',tipo:'tipo',estado:'estado',prioridad:'prioridad',resultado:'resultado'},carreras:{distancia:'distancia',prioridad:'prioCarrera'},plan:{sesion:'sesion'},eventos:{cat:'categoria'},cumples:{cat:'cumple'}};
function csvEsc(v){v=v==null?'':String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function bajar(nombre,txt,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:(tipo||'text/plain')+';charset=utf-8'}));a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
ACT.expcsv=b=>{const k=b.dataset.t,[nom,cols]=TABLAS[k];bajar(`${k}.csv`,'\uFEFF'+[cols.map(c=>csvEsc(c[1])).join(','),...S[k].map(r=>cols.map(c=>csvEsc(c[0]==='homologada'||c[0]==='hecho'||c[0]==='guardada'?(r[c[0]]?'Yes':'No'):r[c[0]])).join(','))].join('\n'),'text/csv')};
ACT.expjson=()=>bajar(`juanhq-copia-${iso(hoy())}.json`,JSON.stringify(S,null,1),'application/json');
INP.impjson=el=>{const f=el.files[0];if(!f)return;f.text().then(t=>{el.value='';try{const r=JSON.parse(t);if(!r||!r.opc)throw new Error('No parece una copia de la app');if(!confirm('Esto reemplaza todos tus datos actuales. ¿Continuar?'))return;S=normalizar(r);save();aplicarTema();draw();toast('Copia restaurada')}catch(e){toast('No se pudo leer: '+e.message)}})};
function parseCSV(t){t=t.replace(/^\uFEFF/,'');const first=t.split(/\r?\n/)[0]||'',dl=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';const rows=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===dl){r.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.length>1||r[0]!=='')rows.push(r);r=[]}else c+=ch}
 if(c!==''||r.length){r.push(c);rows.push(r)}return rows}
function anyISO(s){s=String(s||'').trim();let m=/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/.exec(s);if(m)return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;m=/(\d{1,2})[-/](\d{1,2})[-/](\d{4})/.exec(s);if(m)return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;const d=new Date(s.replace(/\s+\d{1,2}:\d{2}.*$/,''));return isNaN(d)?'':iso(d)}
const CICLO=Object.keys(PAL);
function asegurarOpc(lista,n){if(n&&!opt(lista,n))opts(lista).push({n,c:CICLO[opts(lista).length%CICLO.length]})}
INP.impcsv=el=>{const f=el.files[0],k=$('#imptabla').value;if(!f)return;f.text().then(t=>{el.value='';const rows=parseCSV(t);if(rows.length<2)return toast('El CSV está vacío');const head=rows[0].map(norm),cols=TABLAS[k][1];
 const idx={};cols.forEach(([key])=>{const al=(ALIAS[key]||[norm(key)]).map(norm).concat(norm(key));let j=head.findIndex(h=>al.includes(h));if(key==='fecha'&&k==='eventos')j=-1;idx[key]=j});
 if(k==='eventos'){idx.ini=head.findIndex(h=>['fecha inicio','desde','fecha','inicio'].includes(h));idx.fin=head.findIndex(h=>['fecha fin','hasta','fin'].includes(h))}
 let n=0;rows.slice(1).forEach(r=>{const o={id:uid()};cols.forEach(([key])=>{let v=idx[key]>=0?(r[idx[key]]||'').trim():'';if(['fecha','ini','fin'].includes(key)&&v){const d=anyISO(v),tm=/\s(\d{1,2}):(\d{2})/.exec(v);v=k==='carreras'&&tm?`${d}T${pad(+tm[1])}:${tm[2]}`:d}
  else if(['homologada','hecho','guardada'].includes(key))v=['yes','si','true','1','checked'].includes(norm(v));else if(['nota','sueno','siesta','fatiga','fc','peso','estudio','km','posicion','posCat','dia','mes','anio'].includes(key))v=v===''?'':(isNaN(+v.replace(',','.'))?'':+v.replace(',','.'));
  o[key]=v;const L=(LISTA_DE[k]||{})[key];if(L)asegurarOpc(L,v)});
  if(k==='eventos'&&!o.fin)o.fin=o.ini;if(k==='tareas'&&!o.estado)o.estado='Por hacer';if(k==='tareas')autoTarea(o);
  if(k==='control'&&!o.fecha)return;S[k].push(o);n++});save();draw();toast(`${n} filas importadas`)})};
function renombrar(k,a,b){const sobre=(arr,f)=>arr.forEach(x=>{if(x[f]===a)x[f]=b});({asignatura:()=>{sobre(S.tareas,'asignatura');if(S.asig[a]){S.asig[b]=S.asig[a];delete S.asig[a]}Object.keys(S.clases.c).forEach(q=>{if(S.clases.c[q]===a)S.clases.c[q]=b})},tipo:()=>sobre(S.tareas,'tipo'),prioridad:()=>sobre(S.tareas,'prioridad'),estado:()=>sobre(S.tareas,'estado'),resultado:()=>sobre(S.tareas,'resultado'),categoria:()=>sobre(S.eventos,'cat'),cumple:()=>sobre(S.cumples,'cat'),distancia:()=>sobre(S.carreras,'distancia'),prioCarrera:()=>sobre(S.carreras,'prioridad'),sesion:()=>sobre(S.plan,'sesion'),cat24:()=>S.h24.forEach(d=>d.forEach((v,i)=>{if(v===a)d[i]=b}))})[k]()}
INP.onom=el=>{const k=el.dataset.k,o=opts(k)[+el.dataset.i],v=el.value.trim();if(!v||v===o.n)return;renombrar(k,o.n,v);o.n=v;save();refresh()};
INP.oflag=el=>{opts(el.dataset.k)[+el.dataset.i][el.dataset.f]=el.checked?1:0;save()};INP.okm=el=>{opts('distancia')[+el.dataset.i].km=+el.value;save()};
ACT.oadd=b=>{const k=b.dataset.k;opts(k).push({n:'Nueva opción',c:CICLO[opts(k).length%CICLO.length],...(k==='distancia'?{km:0}:{})});save();refresh()};
ACT.odel=b=>{const k=b.dataset.k,i=+b.dataset.i,o=opts(k)[i];if(!confirm(`¿Quitar “${o.n}” de la lista? Los datos que ya la usan se conservan.`))return;opts(k).splice(i,1);save();refresh()};
ACT.ocol=b=>{const k=b.dataset.k,o=opts(k)[+b.dataset.i];const p=pop(b,`<div class="pal">${CICLO.map(c=>`<button style="background:${PAL[c]}" data-c="${c}" title="${c}" aria-label="${c}"></button>`).join('')}</div><div style="padding:0 8px 8px"><input type="color" value="${P(o.c).length===7?P(o.c):'#fa4e50'}" aria-label="Color personalizado"></div>`);
 p.addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(c){o.c=c.dataset.c;save();closePop();refresh()}});p.querySelector('input').addEventListener('change',e=>{o.c=e.target.value;save();closePop();refresh()})};
INP.anombre=el=>{S.aj.nombre=el.value.trim()||'Juan';save();draw()};INP.aacento=el=>{S.aj.acento=el.value;save();aplicarTema()};
ACT.atema=b=>{S.aj.tema=b.dataset.v;save();aplicarTema();draw()};ACT.aacento0=()=>{S.aj.acento='#fa4e50';save();aplicarTema();refresh()};
INP.cfgc=el=>{const c=S.clases.cfg,k=el.dataset.k;c[k]=el.type==='number'?+el.value:el.value;save()};
ACT.vaciar=()=>{if(confirm('Se borrarán TODOS tus datos de este navegador. ¿Seguro?')&&confirm('Última comprobación: ¿borrar todo?')){S=DEF();save();aplicarTema();go('inicio');draw();toast('Todo vacío')}};
function ajustesUI(){if(esInv())return ajustesInv();const c=S.clases.cfg;
 const lista=k=>`<div class="card"><h3>${LISTAS[k]}</h3>${opts(k).map((o,i)=>`<div class="ol"><button class="sw1" style="background:${P(o.c)}" data-act="ocol" data-k="${k}" data-i="${i}" aria-label="Cambiar color de ${esc(o.n)}"></button><input type="text" value="${esc(o.n)}" data-ch="onom" data-k="${k}" data-i="${i}" aria-label="Nombre">${k==='tipo'?`<label class="row xs mut" title="Cuenta como evaluable"><input type="checkbox" ${o.ev?'checked':''} data-ch="oflag" data-k="${k}" data-i="${i}" data-f="ev">Eval.</label>`:''}${k==='estado'?`<label class="row xs mut" title="Sigue pendiente"><input type="checkbox" ${o.p?'checked':''} data-ch="oflag" data-k="${k}" data-i="${i}" data-f="p">Pdte.</label>`:''}${k==='distancia'?`<input type="number" step="0.001" value="${o.km}" data-ch="okm" data-i="${i}" title="Kilómetros" aria-label="Kilómetros">`:''}<button class="ib" data-act="odel" data-k="${k}" data-i="${i}" aria-label="Quitar">${ico('trash',16)}</button></div>`).join('')}<button class="btn sm" data-act="oadd" data-k="${k}">${ico('plus',15)}Añadir</button></div>`;
 return `<div class="ls" style="margin-bottom:22px">${typeof syncCard==='function'?syncCard():''}<div class="card"><h3>Perfil y aspecto</h3><div class="f" style="margin-bottom:14px"><label>Tu nombre</label><input type="text" value="${esc(S.aj.nombre)}" data-ch="anombre"></div><div class="f" style="margin-bottom:14px"><label>Tema</label>${seg([['dark','Oscuro','moon'],['light','Claro','sun'],['auto','Automático']],S.aj.tema,'atema')}</div><div class="f"><label>Color de acento</label><div class="row"><input type="color" value="${S.aj.acento}" data-ch="aacento"><button class="btn ghost sm" data-act="aacento0">Volver a #fa4e50</button></div></div></div>
 <div class="card"><h3>Horario de clases</h3><div class="fg"><div class="f"><label>Primera clase</label><input type="time" value="${c.inicio}" data-ch="cfgc" data-k="inicio"></div><div class="f"><label>Minutos por clase</label><input type="number" min="20" value="${c.dur}" data-ch="cfgc" data-k="dur"></div><div class="f"><label>Número de clases</label><input type="number" min="1" max="12" value="${c.n}" data-ch="cfgc" data-k="n"></div><div class="f"><label>Recreo tras la clase nº</label><input type="number" min="0" value="${c.rec}" data-ch="cfgc" data-k="rec"></div><div class="f"><label>Minutos de recreo</label><input type="number" min="0" value="${c.recMin}" data-ch="cfgc" data-k="recMin"></div></div></div>
 <div class="card"><h3>Tus datos</h3><p class="sm mut" style="margin-bottom:12px">Todo se guarda solo en este navegador. Haz copias de vez en cuando.</p><div class="grp"><button class="btn sm" data-act="expjson">${ico('down',15)}Copia completa (JSON)</button><label class="btn sm" style="cursor:pointer">${ico('up',15)}Restaurar copia<input type="file" accept=".json" data-ch="impjson" hidden></label></div>
 <h4 style="margin:18px 0 8px">Exportar tablas (CSV)</h4><div class="grp">${Object.entries(TABLAS).map(([k,v])=>`<button class="btn sm" data-act="expcsv" data-t="${k}">${v[0]}</button>`).join('')}</div>
 <h4 style="margin:18px 0 8px">Importar CSV (por ejemplo desde AppFlowy)</h4><div class="grp"><select id="imptabla" style="width:auto">${Object.entries(TABLAS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><label class="btn sm" style="cursor:pointer">${ico('up',15)}Elegir archivo<input type="file" accept=".csv" data-ch="impcsv" hidden></label></div>
 <div class="grp" style="margin-top:20px"><button class="btn sm" data-act="ejemplo">Cargar datos de ejemplo</button><button class="btn danger sm" data-act="vaciar">Borrar todo</button></div></div>
 <div class="card"><h3>Atajos</h3><div class="col sm" style="gap:8px"><span><span class="kbd">Ctrl K</span> o <span class="kbd">N</span> apuntar o ir a cualquier sitio</span><span><span class="kbd">Esc</span> cerrar ventanas</span><span class="mut">En la paleta, escribe una frase y pulsa Enter para apuntarla como tarea al momento.</span></div></div></div>
 <h2 style="font-size:21px;margin:8px 0 6px">Listas y colores</h2><p class="mut sm" style="margin-bottom:16px">Cambia nombres y colores de las opciones: se actualizan en todas partes.</p><div class="ls">${Object.keys(LISTAS).map(lista).join('')}</div>`}
VIEWS.ajustes=ajustesUI;

/* ============ ARRANQUE ============ */
aplicarTema();matchMedia('(prefers-color-scheme:light)').addEventListener&&matchMedia('(prefers-color-scheme:light)').addEventListener('change',()=>{if(S.aj.tema==='auto')aplicarTema()});
if(window.__migrado){window.__migrado=false;save()}
window.addEventListener('hashchange',()=>{if(!SY.on||SY.ready)ruta()});syBoot();
setInterval(()=>{if(R.sec==='inicio'&&!$('.scrim')&&!$('.pop'))refresh()},60000);
